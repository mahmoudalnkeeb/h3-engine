name: Feature request
description: Suggest an addition or change to the engine.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the game problem first, before any solution. What's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: An API sketch is welcome. Keep in mind the engine stays small and dependency-free.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
